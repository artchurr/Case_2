{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приветствие</title>
    <link rel="stylesheet" href="{% static 'greetings/style.css' %}">
</head>
<body>
    <main class="card">
        <div class="icon">👋</div>
        <h1>Добро пожаловать!</h1>
        <p class="subtitle">Введите имя, и мы вас поприветствуем.</p>

        {% if greeting %}
            <div class="greeting" role="status">Привет, {{ greeting }}!</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <label for="{{ form.name.id_for_label }}">Как вас зовут?</label>
            {{ form.name }}
            {% if form.name.errors %}
                <p class="error">{{ form.name.errors.0 }}</p>
            {% endif %}
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
