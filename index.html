<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>

        <input type="text" id="num1" placeholder="Введите число">
        <input type="text" id="num2" placeholder="Введите число">

        <div class="buttons">
            <button onclick="sum()">Сумма</button>
            <button onclick="subtract()">Разность</button>
            <button onclick="multiply()">Произведение</button>
            <button onclick="divide()">Деление</button>
        </div>

        <div class="result">
            <h3>Результат:</h3>
            <p id="result"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
